// Scalafix configuration for Snowpark Connect (SCOS) Scala migration.
// All rules are SyntacticRule implementations — SemanticDB is NOT required.
// They are the SOLE deterministic pre-processing tier (the regex recipe tier was
// removed): every transform runs at the Scalameta AST level, handling multi-line
// chains, string interpolation, computed expressions, enclosing-scope context
// (loops), and chained-receiver forms that line-anchored regexes cannot match.
//
// Rules are referenced by fully-qualified `class:` name so they resolve from
// the runtime/tool classpath WITHOUT needing a META-INF/services/scalafix.v1.Rule
// registration file.  preprocess_scalafix.py puts the compiled rule classes on
// the classpath for you (via the sbt runner) or passes them with
// --tool-classpath (via the Coursier fallback).
//
// How rules get compiled + run (handled automatically by preprocess_scalafix.py):
//   • Preferred — sbt runner (scripts/scalafix_sbt/): sbt compiles SCOSRules.scala
//     and exports a classpath; the script runs `java -cp <cp> scalafix.cli.Cli`.
//   • Fallback  — Coursier: scalafix-cli is launched via `cs launch` and the rule
//     JAR (compiled with pinned coords) is supplied with --tool-classpath.
//
// Manual invocation (rarely needed):
//   uv run --project <SKILL_DIRECTORY> \
//     python <SKILL_DIRECTORY>/scripts/preprocess_scalafix.py \
//     --state <CONVERSION>/migration_state.json

rules = [
  "class:com.snowflake.scos.scalafix.ScosCheckpointToCache"
  "class:com.snowflake.scos.scalafix.ScosMapSubscriptToElementAt"
  "class:com.snowflake.scos.scalafix.ScosWildcardReadAnnotate"
