<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trailer</title>
<style>
  :root{
    --green:#14B85F; --green2:#0E9E4F; --navy:#1A1238; --bg:#0F0E1A;
    --surface:#1A1832; --surface-2:#241F44; --cream:#F5EFEB; --muted:#A9A2C4;
    --amber:#F5A623; --line:rgba(245,239,235,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--cream)}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden}
  .bg{position:absolute;inset:0;z-index:0}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .g1{width:900px;height:900px;background:var(--glow1,rgba(20,184,95,.30));top:-260px;right:-160px;animation:drift1 18s ease-in-out infinite alternate}
  .g2{width:820px;height:820px;background:var(--glow2,rgba(120,80,220,.24));bottom:-280px;left:-180px;animation:drift2 20s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(-80px,60px) scale(1.1)}}
  @keyframes drift2{to{transform:translate(70px,-50px) scale(1.08)}}
  .grid{position:absolute;inset:0;opacity:.05;
    background-image:linear-gradient(var(--cream) 1px,transparent 1px),linear-gradient(90deg,var(--cream) 1px,transparent 1px);
    background-size:80px 80px}
  .scene{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 140px;opacity:0;transform:translateY(34px) scale(.99);
    transition:opacity .42s cubic-bezier(.2,.7,.2,1),transform .42s cubic-bezier(.2,.7,.2,1);pointer-events:none}
  .scene.on{opacity:1;transform:none}
  .scene.out{opacity:0;transform:translateY(-24px) scale(.99);transition:opacity .3s ease,transform .3s ease}
  .kicker{font-size:26px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--green);margin-bottom:30px;
    opacity:0;transform:translateY(14px);transition:.6s .1s}
  .scene.on .kicker{opacity:1;transform:none}
  h1{font-size:120px;line-height:1.02;font-weight:800;letter-spacing:-2px}
  h1.mid{font-size:92px}
  .sub{font-size:34px;color:var(--muted);margin-top:34px;max-width:24ch;line-height:1.4}
  .sub.small{font-size:26px;margin-top:24px;color:var(--muted)}
  .hl{color:var(--green)}
  .kw{display:inline-block;opacity:0;transform:translateY(36px);filter:blur(6px);
    transition:opacity .42s ease,transform .42s cubic-bezier(.2,.8,.2,1),filter .42s ease}
  .scene.on .kw{opacity:1;transform:none;filter:none}
  .scene.on .kw:nth-child(1){transition-delay:.03s}
  .scene.on .kw:nth-child(2){transition-delay:.10s}
  .scene.on .kw:nth-child(3){transition-delay:.17s}
  .scene.on .kw:nth-child(4){transition-delay:.24s}
  .scene.on .kw:nth-child(5){transition-delay:.31s}
  .scene.on .kw:nth-child(6){transition-delay:.38s}
  .logo{display:flex;align-items:center;gap:30px;margin-bottom:46px;opacity:0;transform:scale(.92);
    transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
  .scene.on .logo{opacity:1;transform:none}
  .logo .lmark{color:var(--cream);display:inline-flex;align-items:center;font-weight:800;font-size:48px;letter-spacing:-1px}
  .logo .lmark svg{height:52px;width:auto;display:block}
  .logo .rmark{display:inline-flex;align-items:center;font-weight:800;font-size:44px}
  .logo .rmark svg{height:48px;width:auto;display:block}
  .logo .x{color:var(--muted);font-size:40px;font-weight:300}
  .stat{font-size:210px;font-weight:800;letter-spacing:-6px;color:var(--green);line-height:.95;font-variant-numeric:tabular-nums}
  .stat.amber{color:var(--amber)}
  .statlbl{font-size:40px;font-weight:700;color:var(--cream);margin-top:10px}
  .statlbl .hl{color:var(--green)}
  .chips{display:flex;gap:28px;margin-top:52px}
  .chip{font-size:34px;font-weight:700;padding:24px 40px;border-radius:20px;background:var(--surface);
    border:1px solid rgba(20,184,95,.4);color:var(--cream);opacity:0;transform:translateY(30px) scale(.96);
    transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
  .chip .em{color:var(--green)}
  .scene.on .chip:nth-child(1){transition-delay:.35s}
  .scene.on .chip:nth-child(2){transition-delay:.55s}
  .scene.on .chip:nth-child(3){transition-delay:.75s}
  .scene.on .chip:nth-child(4){transition-delay:.95s}
  .scene.on .chip{opacity:1;transform:none}
  .domains{display:flex;gap:0;align-items:center;margin-top:44px;font-size:52px;font-weight:800}
  .domains .d{opacity:0;transform:translateY(24px);transition:.5s}
  .domains .sep{color:var(--muted);margin:0 26px;font-weight:400}
  .scene.on .domains .d:nth-child(1){transition-delay:.3s}
  .scene.on .domains .d:nth-child(3){transition-delay:.5s}
  .scene.on .domains .d:nth-child(5){transition-delay:.7s}
  .scene.on .domains .d:nth-child(7){transition-delay:.9s}
  .scene.on .domains .d{opacity:1;transform:none}
  .flow{display:flex;align-items:center;justify-content:center;gap:0;margin-top:60px;flex-wrap:wrap}
  .node{background:var(--surface);border:2px dashed rgba(245,239,235,.28);border-radius:18px;padding:26px 30px;
    min-width:180px;opacity:0;transform:translateY(26px);transition:opacity .5s ease,transform .5s ease,border-color .6s ease,background .6s ease}
  .node .t{font-size:30px;font-weight:700}
  .node .s{font-size:19px;color:var(--muted);margin-top:6px}
  .flow.on .node{opacity:1;transform:none}
  .flow.on .node:nth-child(1){transition-delay:.0s}
  .flow.on .node:nth-child(3){transition-delay:.16s}
  .flow.on .node:nth-child(5){transition-delay:.32s}
  .flow.on .node:nth-child(7){transition-delay:.48s}
  .flow.on .node:nth-child(9){transition-delay:.64s}
  .arrow{color:var(--muted);font-size:44px;margin:0 14px;opacity:0;transition:opacity .3s ease}
  .flow.on .arrow{opacity:.8}
  .flow.on .arrow:nth-child(2){transition-delay:.12s}
  .flow.on .arrow:nth-child(4){transition-delay:.28s}
  .flow.on .arrow:nth-child(6){transition-delay:.44s}
  .flow.on .arrow:nth-child(8){transition-delay:.60s}
  .flow2{display:flex;align-items:center;justify-content:center;margin-top:70px;opacity:0;transform:scale(.9);
    transition:opacity .5s ease .28s,transform .5s cubic-bezier(.2,.8,.2,1) .28s}
  .scene.on .flow2{opacity:1;transform:none}
  .node.green{border:2px solid var(--green);background:rgba(20,184,95,.12);box-shadow:0 0 0 1px rgba(20,184,95,.25),0 20px 50px -24px rgba(20,184,95,.6)}
  .arrow.green{color:var(--green);font-size:70px;margin:0 34px}
  .arch{display:flex;align-items:stretch;justify-content:center;margin-top:38px;flex-wrap:wrap}
  .abox{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid rgba(20,184,95,.4);
    border-radius:16px;padding:18px 18px;min-width:200px;max-width:224px;text-align:center;
    opacity:0;transform:translateY(24px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .scene.on .abox{opacity:1;transform:none}
  .abox .at{font-size:23px;font-weight:800}
  .abox .as{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.3}
  .abox .atag{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;color:var(--green);
    background:rgba(20,184,95,.14);border:1px solid rgba(20,184,95,.3);border-radius:999px;padding:4px 10px}
  .aconn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:110px;padding:0 4px}
  .aconn .al{font-size:12.5px;color:var(--muted);margin-bottom:4px;line-height:1.2;max-width:108px}
  .aconn .aa{color:var(--green);font-size:32px;opacity:0;transition:opacity .4s ease}
  .scene.on .aconn .aa{opacity:.9}
  .overlays{display:flex;gap:16px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .opill{font-size:16px;font-weight:700;color:var(--cream);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:999px;padding:9px 18px;opacity:0;transform:translateY(14px);
    transition:opacity .45s ease,transform .45s ease}
  .opill b{color:var(--green)}
  .scene.on .opill{opacity:1;transform:none}
  .snow{position:relative;width:1480px;max-width:92%;background:#0B0E17;border:1px solid rgba(255,255,255,.10);
    border-radius:14px;overflow:hidden;box-shadow:0 34px 90px -34px rgba(0,0,0,.85);margin-top:26px;text-align:left;
    opacity:0;transform:translateY(26px) scale(.99);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .scene.on .snow{opacity:1;transform:none}
  .snowbar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#11151F;border-bottom:1px solid rgba(255,255,255,.08)}
  .flake{color:#29B5E8;font-size:18px}
  .snowbar .ttl{font-size:15px;color:#C7D0E0;font-weight:600}
  .snowbar .run{margin-left:auto;font-size:13px;color:#04121a;background:#29B5E8;font-weight:800;padding:5px 13px;border-radius:7px}
  .snowbody{padding:18px 22px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.65;color:#c7d0e0}
  .cl{opacity:0;transform:translateY(8px);transition:opacity .35s ease,transform .35s ease}
  .scene.on .cl{opacity:1;transform:none}
  .kwd{color:#7FD1A0}.fn{color:#E6C07B}.str{color:#98C379}.cmt{color:#6F7690}.blue{color:#29B5E8}.ok{color:#3FD07E;font-weight:700}
  .res{margin:8px 0 4px;border:1px solid rgba(255,255,255,.10);border-radius:8px;overflow:hidden;
    opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease}
  .scene.on .res{opacity:1;transform:none}
  .rrow{display:flex;font-size:14px;border-top:1px solid rgba(255,255,255,.06)}
  .rrow.rh{background:#151A26;color:#8B93A7;font-weight:700;border-top:none}
  .cellx{padding:7px 14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .callout{position:absolute;font-size:15px;font-weight:700;color:#04121a;background:var(--green);
    border-radius:10px;padding:8px 14px;box-shadow:0 12px 30px -10px rgba(20,184,95,.7);
    opacity:0;transform:scale(.9);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.8,.2,1);z-index:5}
  .scene.on .callout{opacity:1;transform:none}
  .callout::after{content:"";position:absolute;left:-5px;top:50%;margin-top:-6px;width:12px;height:12px;background:var(--green);transform:rotate(45deg);border-radius:2px}
  .prog{position:absolute;bottom:0;left:0;height:5px;background:var(--green);z-index:5;width:0;box-shadow:0 0 16px rgba(20,184,95,.7)}
  .foot{position:absolute;bottom:40px;left:0;right:0;text-align:center;font-size:24px;color:var(--muted);z-index:4;opacity:0;transition:opacity .8s ease}
  .foot.on{opacity:1}

  /* ============================================================================
     cellgrid — a catalogue as cells. Some already have data, some are blank and
     fill in, and some deliberately stay blank (the abstentions).
     ========================================================================== */
  .cgwrap{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .cgrid{display:grid;gap:7px}
  .cell{width:26px;height:26px;border-radius:5px;background:rgba(255,255,255,.11);border:1px solid var(--line)}
  .cell.fill{background:var(--green);border-color:var(--green);opacity:0;transform:scale(.35);
    transition:opacity .34s ease,transform .34s cubic-bezier(.2,.8,.2,1)}
  .scene.on .cell.fill{opacity:1;transform:none}
  .cell.stay{background:transparent;border:1.5px dashed var(--green);opacity:.55}
  .cglegend{display:flex;gap:26px;font-size:18px;color:var(--muted);opacity:0;transition:opacity .5s ease 1.1s}
  .scene.on .cglegend{opacity:1}
  .cglegend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:8px;vertical-align:-1px}

  /* ============================================================================
     bars — before/after. The track shows the "before" fill; the coloured bar
     grows to the "after" value on scene entry (width driven from JS).
     ========================================================================== */
  .bars{margin-top:34px;width:100%;max-width:900px;display:flex;flex-direction:column;gap:22px}
  .bar{text-align:left}
  .bar .blab{display:flex;justify-content:space-between;align-items:baseline;font-size:21px;font-weight:700;margin-bottom:9px}
  .bar .blab em{font-style:normal;color:var(--muted);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
  .bar .blab em b{color:var(--green);font-weight:800}
  .bar .btrack{position:relative;height:22px;border-radius:11px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar .bfrom{position:absolute;top:0;bottom:0;left:0;background:var(--surface-2);border-radius:11px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
  .bar .bto{position:absolute;top:0;bottom:0;left:0;background:var(--green);border-radius:11px;
    transition:width 1.05s cubic-bezier(.2,.8,.2,1)}

  /* ============================================================================
     funnel — narrowing stages. Integer count-ups only.
     ========================================================================== */
  .funnel{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px}
  .fstage{background:linear-gradient(180deg,var(--surface),var(--surface-2));border:1px solid var(--green);
    border-radius:12px;padding:13px 24px;text-align:center;
    opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .scene.on .fstage{opacity:1;transform:none}
  .fstage .fv{font-size:36px;font-weight:800;color:var(--green);line-height:1.05;font-variant-numeric:tabular-nums}
  .fstage .ft{font-size:19px;font-weight:700;margin-top:2px}
  .fstage .fs{font-size:14.5px;color:var(--muted);margin-top:3px}
  .fdrop{color:var(--muted);font-size:24px;line-height:1;opacity:0;transition:opacity .4s ease}
  .scene.on .fdrop{opacity:.65}

  /* ============================================================================
     branch — the abstention decision, drawn rather than asserted.
     ========================================================================== */
  .branch{margin-top:28px;display:flex;flex-direction:column;align-items:center}
  .bq{font-size:25px;font-weight:800;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:14px 28px;opacity:0;transform:translateY(16px);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .scene.on .bq{opacity:1;transform:none}
  .blegs{display:flex;gap:80px;margin-top:22px;align-items:flex-start}
  .bleg{display:flex;flex-direction:column;align-items:center;gap:9px}
  .bedge{font-size:15px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);
    opacity:0;transition:opacity .45s ease}
  .scene.on .bedge{opacity:1}
  .bstem{width:2px;height:20px;background:rgba(255,255,255,.20)}
  .bnode{background:var(--surface);border:2px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 22px;
    text-align:center;opacity:0;transform:translateY(14px) scale(.96);
    transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
  .scene.on .bnode{opacity:1;transform:none}
  .bnode.good{border-color:var(--green);background:rgba(245,181,63,.10)}
  .bnode .bt{font-size:22px;font-weight:800}
  .bnode .bs{font-size:14.5px;color:var(--muted);margin-top:3px}

  /* ============================================================================
     meter — fills to a named ceiling, stops, and suspends itself.
     ========================================================================== */
  .meter{margin-top:84px;width:100%;max-width:840px}
  .mtrack{position:relative;height:38px;border-radius:19px;background:rgba(255,255,255,.07)}
  .mfill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:19px;
    background:linear-gradient(90deg,rgba(255,255,255,.22),var(--green));
    transition:width 1.45s cubic-bezier(.35,.75,.2,1)}
  .mcap{position:absolute;top:-9px;bottom:-9px;width:3px;background:var(--cream);border-radius:2px;opacity:.9}
  .mcaplab{position:absolute;top:-44px;transform:translateX(-50%);font-size:17px;font-weight:800;
    color:var(--cream);white-space:nowrap}
  .mhalt{display:inline-flex;align-items:center;gap:10px;margin-top:24px;font-size:20px;font-weight:800;
    color:var(--green);background:rgba(245,181,63,.12);border:1px solid var(--green);border-radius:999px;
    padding:10px 22px;opacity:0;transform:scale(.94);
    transition:opacity .4s ease 1.5s,transform .45s cubic-bezier(.2,.8,.2,1) 1.5s}
  .scene.on .mhalt{opacity:1;transform:none}

  /* ============================================================================
     presenter layout — content is confined to the left column and the right
     672px is left empty for a talking head. One inset does the reserving; the
     rest is a type scale. Deliberately NOT a uniform transform:scale(), which
     would drop the worksheet monospace to ~10px and make it unreadable.
     ========================================================================== */
  .camzone{display:none}
  #stage.presenter.guides .camzone{display:block;position:absolute;top:0;right:0;width:672px;height:100%;
    z-index:6;border-left:1px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.02)}
  #stage.presenter.guides .camzone::after{content:"camera";position:absolute;top:18px;left:0;right:0;
    text-align:center;font-size:15px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.34)}
  #stage.presenter .scene{right:672px;padding:0 74px}
  #stage.presenter .foot{right:672px;bottom:34px;font-size:19px}
  #stage.presenter .prog{max-width:1248px}
  #stage.presenter h1{font-size:78px;letter-spacing:-1.5px}
  #stage.presenter h1.mid{font-size:60px}
  #stage.presenter .sub{font-size:26px;margin-top:26px;max-width:26ch}
  #stage.presenter .sub.small{font-size:22px;margin-top:20px}
  #stage.presenter .kicker{font-size:20px;letter-spacing:4.5px;margin-bottom:22px}
  #stage.presenter .stat{font-size:140px;letter-spacing:-4px}
  #stage.presenter .statlbl{font-size:28px}
  #stage.presenter .logo{gap:22px;margin-bottom:34px}
  #stage.presenter .logo .lmark svg{height:38px}
  #stage.presenter .logo .rmark svg{height:34px}
  #stage.presenter .logo .lmark{font-size:36px}
  #stage.presenter .logo .rmark{font-size:32px}
  #stage.presenter .logo .x{font-size:28px}
  #stage.presenter .chips{gap:16px;margin-top:34px;flex-wrap:wrap;justify-content:center}
  #stage.presenter .chip{font-size:23px;padding:16px 24px;border-radius:14px}
  #stage.presenter .domains{font-size:34px;margin-top:30px;flex-wrap:wrap;justify-content:center}
  #stage.presenter .domains .sep{margin:0 16px}
  #stage.presenter .flow{margin-top:40px}
  #stage.presenter .node{min-width:124px;padding:15px 16px;border-radius:14px}
  #stage.presenter .node .t{font-size:20px}
  #stage.presenter .node .s{font-size:13.5px}
  #stage.presenter .arrow{font-size:28px;margin:0 7px}
  #stage.presenter .arrow.green{font-size:44px;margin:0 22px}
  #stage.presenter .flow2{margin-top:44px}
  #stage.presenter .snow{width:100%;max-width:100%;margin-top:18px}
  #stage.presenter .snowbody{font-size:14px;line-height:1.62;padding:15px 18px}
  #stage.presenter .rrow{font-size:12.5px}
  #stage.presenter .cellx{padding:6px 11px}
  #stage.presenter .callout{font-size:13px;padding:7px 12px}
  #stage.presenter .cell{width:22px;height:22px;border-radius:4px}
  #stage.presenter .cgrid{gap:6px}
  #stage.presenter .cglegend{font-size:15px;gap:20px}
  #stage.presenter .bars{gap:18px}
  #stage.presenter .bar .blab{font-size:19px}
  #stage.presenter .bar .blab em{font-size:17px}
  #stage.presenter .bar .btrack{height:19px;border-radius:10px}
  #stage.presenter .fstage{padding:11px 20px}
  #stage.presenter .fstage .fv{font-size:30px}
  #stage.presenter .fstage .ft{font-size:17px}
  #stage.presenter .bq{font-size:22px;padding:12px 22px}
  #stage.presenter .blegs{gap:52px}
  #stage.presenter .bnode{padding:11px 18px}
  #stage.presenter .bnode .bt{font-size:19px}
  #stage.presenter .bnode .bs{font-size:13.5px}
  #stage.presenter .meter{margin-top:86px}
  #stage.presenter .mtrack{height:32px;border-radius:16px}
  #stage.presenter .mhalt{font-size:18px;padding:9px 18px}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="grid"></div></div>
  <div id="scenes"></div>
  <div class="camzone"></div>
  <div class="foot" id="foot"></div>
  <div class="prog" id="prog"></div>
</div>
<script>
  // ===== scene-spec-driven trailer engine =====
  // Inputs (injected by scripts/render.mjs, or fall back to the demo below):
  //   window.__SCENES__ : [ {type, kicker, lines[], sub, dur, ...type-specific} ]
  //   window.__BRAND__  : {primary,dark,surface,surface2,cream,muted,accent,line,glow1,glow2,logoLeft,logoRight}
  //   window.__FOOT__   : footer text shown on the cta scene
  const DEFAULT_BRAND = { logoLeft:'<span>Your&nbsp;Brand</span>', logoRight:'<span>Snowflake</span>' };
  const DEFAULT_SCENES = [
    {type:'hook', logo:true, lines:['Make a *trailer.*'], sub:'scene-spec → branded MP4', dur:3500},
    {type:'stat', kicker:'One number', stat:{to:30, suffix:'s', label:'to *say it well*'}, sub:'one idea per scene', dur:3500},
    {type:'cta', logo:true, lines:['Ship *it.*'], sub:"That's the engine.", dur:3500}
  ];
  const SCENES = Array.isArray(window.__SCENES__) ? window.__SCENES__ : DEFAULT_SCENES;
  const BRAND = Object.assign({}, DEFAULT_BRAND, window.__BRAND__ || {});
  const FOOT = window.__FOOT__ || '';
  // 'center' (default) or 'presenter' (left column, right 672px reserved for a camera)
  const LAYOUT = window.__LAYOUT__ || 'center';
  // 'auto' (timed, for video render) or 'present' (advance by key, holds forever)
  const MODE = window.__MODE__ || 'auto';
  const GUIDES = window.__GUIDES__ === true;

  // apply brand tokens
  const rs=document.documentElement.style;
  const map={primary:'--green',dark:'--bg',surface:'--surface',surface2:'--surface-2',cream:'--cream',muted:'--muted',accent:'--amber',line:'--line',glow1:'--glow1',glow2:'--glow2'};
  for(const k in map){ if(BRAND[k]) rs.setProperty(map[k], BRAND[k]); }

  // text helpers
  const nbsp=s=>(s||'').replace(/_/g,'\u00A0');
  const words=s=>nbsp(s).split(' ').map(w=>{const hl=/^\*.*\*$/.test(w); if(hl)w=w.slice(1,-1); return '<span class="kw'+(hl?' hl':'')+'">'+w+'</span>';}).join(' ');
  const linesHTML=s=>(s.lines||[s.title||'']).map(words).join('<br>');
  const hlT=s=>nbsp(s).replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>');
  const emT=s=>nbsp(s).replace(/\*([^*]+)\*/g,'<span class="em">$1</span>');
  const bT =s=>nbsp(s).replace(/\*([^*]+)\*/g,'<b>$1</b>');
  const logo=()=>{const l=BRAND.logoLeft||'',r=BRAND.logoRight||'';
    return '<div class="logo">'+(l?'<span class="lmark">'+l+'</span>':'')+(l&&r?'<span class="x">×</span>':'')+(r?'<span class="rmark">'+r+'</span>':'')+'</div>';};
  const sub=s=>s.sub?'<div class="sub'+(s.type==='hook'||s.type==='cta'?'':' small')+'">'+hlT(s.sub)+'</div>':'';
  const kick=s=>s.kicker?'<div class="kicker">'+s.kicker+'</div>':'';

  function flowHTML(nodes){let h='';(nodes||[]).forEach((n,i)=>{h+='<div class="node"><div class="t">'+n.t+'</div><div class="s">'+(n.s||'')+'</div></div>';if(i<nodes.length-1)h+='<div class="arrow">→</div>';});return '<div class="flow">'+h+'</div>';}
  function flow2HTML(f){return '<div class="flow2">'+(f||[]).map(n=>'<div class="node green"><div class="t">'+n.t+'</div><div class="s">'+(n.s||'')+'</div></div>').join('<div class="arrow green">→</div>')+'</div>';}
  function archHTML(s){let h='';const boxes=s.boxes||[],labels=s.labels||[];boxes.forEach((b,i)=>{h+='<div class="abox" style="transition-delay:'+(0.10+i*0.35).toFixed(2)+'s"><div class="at">'+b.t+'</div><div class="as">'+(b.s||'')+'</div>'+(b.tag?'<div class="atag">'+b.tag+'</div>':'')+'</div>';if(i<boxes.length-1)h+='<div class="aconn"><div class="al">'+(labels[i]||'')+'</div><div class="aa" style="transition-delay:'+(0.35+i*0.35).toFixed(2)+'s">→</div></div>';});let p=(s.pills||[]).map((x,i)=>'<div class="opill" style="transition-delay:'+(1.45+i*0.15).toFixed(2)+'s">'+bT(x)+'</div>').join('');return '<div class="arch">'+h+'</div>'+(p?'<div class="overlays">'+p+'</div>':'');}
  function snowHTML(s){let d=0.35,body='';(s.body||[]).forEach(it=>{if(it.code!==undefined){body+='<div class="cl" style="transition-delay:'+d.toFixed(2)+'s">'+it.code+'</div>';d+=0.14;}else if(it.grid){const hd='<div class="rrow rh">'+it.grid.cols.map(c=>'<div class="cellx">'+c+'</div>').join('')+'</div>';const rr=it.grid.rows.map(r=>'<div class="rrow">'+r.map(c=>'<div class="cellx">'+c+'</div>').join('')+'</div>').join('');body+='<div class="res" style="transition-delay:'+d.toFixed(2)+'s">'+hd+rr+'</div>';d+=0.5;}});const pos={tr:'top:78px;right:14px',mr:'top:236px;right:14px',br:'bottom:40px;right:14px'};let cd=0.8;const co=(s.callouts||[]).map(c=>{const r='<div class="callout" style="'+(pos[c.pos]||pos.mr)+';transition-delay:'+cd.toFixed(2)+'s">'+c.text+'</div>';cd+=0.55;return r;}).join('');return '<div class="snow"><div class="snowbar"><span class="flake">❄</span><span class="ttl">'+(s.title||'Worksheet')+'</span><span class="run">▶ Run</span></div><div class="snowbody">'+body+'</div>'+co+'</div>';}

  // ---- cellgrid: a catalogue as cells. Deterministic PRNG so renders repeat. ----
  function cellGridHTML(s){
    const g=s.cells||{}, cols=g.cols||18, rows=g.rows||6, total=cols*rows;
    let seed=(g.seed||7)>>>0;
    const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
    const blankPct=g.blankPct!==undefined?g.blankPct:0.30;
    const stayPct =g.stayPct !==undefined?g.stayPct :0.04;
    let out=[],n=0;
    for(let i=0;i<total;i++){
      const r=rnd();
      if(r<stayPct){ out.push('<div class="cell stay"></div>'); }
      else if(r<blankPct){ out.push('<div class="cell fill" style="transition-delay:'+(0.30+n*0.021).toFixed(3)+'s"></div>'); n++; }
      else { out.push('<div class="cell"></div>'); }
    }
    const leg=(g.legend||[]).map(x=>'<span><i style="background:'+(x.c||'var(--green)')+(x.b?';border:1.5px dashed '+x.b+';background:transparent':'')+'"></i>'+x.t+'</span>').join('');
    return '<div class="cgwrap"><div class="cgrid" style="grid-template-columns:repeat('+cols+',max-content)">'
      +out.join('')+'</div>'+(leg?'<div class="cglegend">'+leg+'</div>':'')+'</div>';
  }

  // ---- bars: before/after. Width is driven from enter() via data-to. ----
  function barsHTML(s){
    return '<div class="bars">'+(s.bars||[]).map((b,i)=>{
      const from=+b.from||0, to=+b.to||0;
      // NOTE: label text is static on purpose — count-ups round, so decimals must not animate.
      const note=b.note!==undefined?b.note:(from+'% → <b>'+to+'%</b>');
      return '<div class="bar"><div class="blab"><span>'+b.label+'</span><em>'+note+'</em></div>'
        +'<div class="btrack">'
        +'<div class="bto" data-from="'+from+'" data-to="'+to+'" style="width:'+from+'%;transition-delay:'
        +(0.30+i*0.16).toFixed(2)+'s"></div>'
        // bfrom paints AFTER bto so the "before" portion sits on top: grey up to
        // `from`, brand colour only for the delta. Otherwise bto covers it entirely
        // and the before/after split is invisible.
        +'<div class="bfrom" style="width:'+from+'%"></div>'
        +'</div></div>';
    }).join('')+'</div>';
  }

  // ---- funnel: narrowing stages. Integer count-ups only. ----
  function funnelHTML(s){
    const st=s.stages||[], narrow=s.narrow||20;
    return '<div class="funnel">'+st.map((x,i)=>{
      const d=(0.20+i*0.32).toFixed(2);
      const drop=i?'<div class="fdrop" style="transition-delay:'+d+'s">↓</div>':'';
      return drop+'<div class="fstage" style="width:'+(100-i*narrow)+'%;transition-delay:'+d+'s">'
        +'<div class="fv" data-countup="'+(x.v||0)+'">0</div>'
        +'<div class="ft">'+(x.t||'')+'</div>'+(x.s?'<div class="fs">'+x.s+'</div>':'')+'</div>';
    }).join('')+'</div>';
  }

  // ---- branch: the abstention decision, drawn rather than asserted. ----
  function branchHTML(s){
    const leg=(l,cls,d0)=>{
      if(!l) return '';
      let h='<div class="bleg"><div class="bedge" style="transition-delay:'+d0.toFixed(2)+'s">'+(l.edge||'')+'</div>'
        +'<div class="bstem"></div>'
        +'<div class="bnode '+cls+'" style="transition-delay:'+d0.toFixed(2)+'s"><div class="bt">'+(l.t||'')+'</div>'
        +(l.s?'<div class="bs">'+l.s+'</div>':'')+'</div>';
      if(l.then) h+='<div class="fdrop" style="transition-delay:'+(d0+0.22).toFixed(2)+'s">↓</div>'
        +'<div class="bnode" style="transition-delay:'+(d0+0.28).toFixed(2)+'s"><div class="bt">'+(l.then.t||'')+'</div>'
        +(l.then.s?'<div class="bs">'+l.then.s+'</div>':'')+'</div>';
      return h+'</div>';
    };
    return '<div class="branch"><div class="bq">'+hlT(s.question||'')+'</div>'
      +'<div class="blegs">'+leg(s.yes,'good',0.35)+leg(s.no,'',0.60)+'</div></div>';
  }

  // ---- meter: fills to a named ceiling, stops, suspends itself. ----
  function meterHTML(s){
    const m=s.meter||{}, cap=m.capPct!==undefined?m.capPct:78;
    return '<div class="meter"><div class="mtrack">'
      +'<div class="mfill" data-from="0" data-to="'+cap+'"></div>'
      +'<div class="mcap" style="left:'+cap+'%"></div>'
      +(m.capLabel?'<div class="mcaplab" style="left:'+cap+'%">'+m.capLabel+'</div>':'')
      +'</div>'+(m.haltLabel?'<div class="mhalt">'+m.haltLabel+'</div>':'')+'</div>';
  }

  function sceneHTML(s){
    switch(s.type){
      case 'hook': return logo()+'<h1>'+linesHTML(s)+'</h1>'+sub(s);
      case 'cellgrid': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+cellGridHTML(s)+sub(s);
      case 'bars': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+barsHTML(s)+sub(s);
      case 'funnel': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+funnelHTML(s)+sub(s);
      case 'branch': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+branchHTML(s)+sub(s);
      case 'meter': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+meterHTML(s)+sub(s);
      case 'cta':  return logo()+'<h1 class="mid">'+linesHTML(s)+'</h1>'+sub(s);
      case 'flow': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+flowHTML(s.nodes)+sub(s);
      case 'turn': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+(s.flow2?flow2HTML(s.flow2):'')+sub(s);
      case 'stat': {const a=s.stat.accent==='amber'?' amber':'';return kick(s)+'<div class="stat'+a+'">'+(s.stat.prefix||'')+'<span data-countup="'+s.stat.to+'">0</span>'+(s.stat.suffix||'')+'</div>'+(s.stat.label?'<div class="statlbl">'+hlT(s.stat.label)+'</div>':'')+sub(s);}
      case 'feature': return kick(s)+'<h1 class="mid">'+words(s.title||'')+'</h1><div class="chips">'+(s.chips||[]).map(c=>'<div class="chip">'+emT(c)+'</div>').join('')+'</div>'+sub(s);
      case 'arch': return kick(s)+archHTML(s);
      case 'snowsight': return kick(s)+snowHTML(s);
      case 'domains': return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1><div class="domains">'+(s.domains||[]).map(d=>'<span class="d">'+d+'</span>').join('<span class="sep">·</span>')+'</div>';
      default: return kick(s)+'<h1 class="mid">'+linesHTML(s)+'</h1>'+sub(s);
    }
  }

  // build scenes
  const stage=document.getElementById('scenes');
  // layout + guide classes go on #stage, which is what the presenter CSS keys off
  const stageEl=document.getElementById('stage');
  if(LAYOUT==='presenter') stageEl.classList.add('presenter');
  if(GUIDES) stageEl.classList.add('guides');
  SCENES.forEach(s=>{const sec=document.createElement('section');sec.className='scene'+(s.type==='cta'?' cta':'');sec.innerHTML=sceneHTML(s);stage.appendChild(sec);});
  const scenes=[...document.querySelectorAll('.scene')];
  const prog=document.getElementById('prog'), foot=document.getElementById('foot');
  if(FOOT) foot.textContent=FOOT;

  // timeline from scene durations
  let at=0; const T=SCENES.map((s,i)=>{const seg={i,at,dur:s.dur||4000}; at+=seg.dur; return seg;}); const END=at;
  let started={}, ended={};
  function countUp(el,to,dur){const t0=performance.now();(function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=Math.round(to*e).toLocaleString();if(p<1)requestAnimationFrame(step);})(performance.now());}
  // width-driven visuals (bars, meter): snap back to `from`, then transition to `to`
  function resetWidths(sc){sc.querySelectorAll('[data-to]').forEach(el=>{const t=el.style.transition;el.style.transition='none';el.style.width=(el.dataset.from||0)+'%';void el.offsetWidth;el.style.transition=t||'';});}
  function growWidths(sc){sc.querySelectorAll('[data-to]').forEach(el=>{el.style.width=el.dataset.to+'%';});}
  function enter(seg){const sc=scenes[seg.i];if(!sc)return;sc.classList.remove('out');sc.classList.add('on');const fl=sc.querySelector('.flow');if(fl)setTimeout(()=>fl.classList.add('on'),200);sc.querySelectorAll('[data-countup]').forEach(el=>setTimeout(()=>countUp(el,+el.dataset.countup,900),250));setTimeout(()=>growWidths(sc),60);if(sc.classList.contains('cta')&&FOOT)setTimeout(()=>foot.classList.add('on'),650);}
  function leave(seg){const sc=scenes[seg.i];if(!sc)return;sc.classList.remove('on');sc.classList.add('out');const fl=sc.querySelector('.flow');if(fl)fl.classList.remove('on');}

  if(MODE==='present'){
    // Manual advance for talking over the visuals. Each beat animates on entry
    // then holds indefinitely. __DONE__ is never set, so nothing tries to finish.
    let idx=0;
    function go(n){
      if(n<0||n>=SCENES.length) return;
      if(n!==idx){ leave(T[idx]); }
      idx=n;
      const sc=scenes[idx];
      sc.classList.remove('on','out');
      resetWidths(sc);
      const fl=sc.querySelector('.flow'); if(fl) fl.classList.remove('on');
      foot.classList.remove('on');
      void sc.offsetWidth;            // force reflow so the entry animation replays
      enter(T[idx]);
      prog.style.width=(((idx+1)/SCENES.length)*100)+'%';
    }
    window.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();go(idx+1);}
      else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(idx-1);}
      else if(e.key==='Home'){e.preventDefault();go(0);}
      else if(e.key==='End'){e.preventDefault();go(SCENES.length-1);}
      else if(e.key==='r'||e.key==='R'){e.preventDefault();go(idx);}   // replay this beat
    });
    window.addEventListener('click',()=>go(idx+1));
    setTimeout(()=>go(0),300);
  } else {
    const start=performance.now();
    function loop(now){const t=now-start;prog.style.width=Math.min(100,(t/END)*100)+'%';T.forEach(seg=>{const on=t>=seg.at&&t<seg.at+seg.dur;if(on&&!started[seg.i]){started[seg.i]=true;enter(seg);}if(!on&&started[seg.i]&&!ended[seg.i]&&t>=seg.at+seg.dur){ended[seg.i]=true;leave(seg);}});if(t>=END+800){window.__DONE__=true;return;}requestAnimationFrame(loop);}
    setTimeout(()=>requestAnimationFrame(loop),400);
  }
</script>
</body>
</html>
